<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Maze Game</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script>
        // Basic setup
        let scene, camera, renderer, player, controls;
        let mazeWidth = 10, mazeHeight = 10;
        let maze = [];

        // Create scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xaaaaaa);

        // Set up camera
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.y = 1;
        camera.position.z = 5;

        // Set up the renderer
        renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Player settings (simple cube)
        let playerGeometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
        let playerMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
        player = new THREE.Mesh(playerGeometry, playerMaterial);
        scene.add(player);

        // Create a simple maze
        function generateMaze() {
            // Create maze using a simple grid (walls represented by cubes)
            for (let x = 0; x < mazeWidth; x++) {
                maze[x] = [];
                for (let y = 0; y < mazeHeight; y++) {
                    let cube;
                    if (Math.random() > 0.7) { // Randomly place walls
                        let geometry = new THREE.BoxGeometry(1, 1, 1);
                        let material = new THREE.MeshBasicMaterial({ color: 0x0000ff });
                        cube = new THREE.Mesh(geometry, material);
                        cube.position.set(x - mazeWidth / 2, 0.5, y - mazeHeight / 2);
                        scene.add(cube);
                    }
                    maze[x][y] = cube;
                }
            }
        }

        generateMaze();

        // Basic player controls (move the player in the maze)
        let moveSpeed = 0.1;
        let keys = {};

        window.addEventListener('keydown', function (event) {
            keys[event.code] = true;
        });

        window.addEventListener('keyup', function (event) {
            keys[event.code] = false;
        });

        function movePlayer() {
            if (keys['ArrowUp'] || keys['KeyW']) {
                player.position.z -= moveSpeed;
            }
            if (keys['ArrowDown'] || keys['KeyS']) {
                player.position.z += moveSpeed;
            }
            if (keys['ArrowLeft'] || keys['KeyA']) {
                player.position.x -= moveSpeed;
            }
            if (keys['ArrowRight'] || keys['KeyD']) {
                player.position.x += moveSpeed;
            }
        }

        // Render loop
        function animate() {
            requestAnimationFrame(animate);

            // Update player movement
            movePlayer();

            // Render the scene
            renderer.render(scene, camera);
        }

        animate();

        // Handle window resize
        window.addEventListener('resize', function () {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
