<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Low-Poly Maze Horror</title>
  <style>
    /* General Styling */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: black;
      color: white;
      overflow: hidden;
    }

    #menu {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    #menu button {
      background-color: #333;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 10px;
      font-size: 18px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    #menu button:hover {
      background-color: #555;
    }

    #game-container {
      display: none; /* Hidden by default until game starts */
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <!-- Menu -->
  <div id="menu">
    <h1>Low-Poly Maze Horror</h1>
    <button id="start-game">Start Game</button>
    <button id="exit-game">Exit</button>
  </div>

  <!-- Game -->
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <script>
    // DOM Elements
    const menu = document.getElementById('menu');
    const gameContainer = document.getElementById('game-container');
    const startGameButton = document.getElementById('start-game');
    const exitGameButton = document.getElementById('exit-game');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Game Variables
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let player = { x: 150, y: 150, speed: 2 };
    let keys = {};
    let monsters = [{ x: 300, y: 300, speed: 1 }]; // Simple monster

    // Show Game
    startGameButton.addEventListener('click', () => {
      menu.style.display = 'none';
      gameContainer.style.display = 'block';
      canvas.requestPointerLock();
      gameLoop();
    });

    // Exit Game
    exitGameButton.addEventListener('click', () => {
      alert('Thanks for playing!');
    });

    // Set up pointer lock
    canvas.requestPointerLock = canvas.requestPointerLock || canvas.mozRequestPointerLock;

    canvas.onclick = () => {
      canvas.requestPointerLock();
    };

    document.addEventListener('pointerlockchange', lockChangeAlert, false);

    function lockChangeAlert() {
      if (document.pointerLockElement === canvas) {
        document.addEventListener('mousemove', mouseMoveHandler, false);
      } else {
        document.removeEventListener('mousemove', mouseMoveHandler, false);
      }
    }

    // Track mouse movement
    function mouseMoveHandler(e) {
      player.x += e.movementX * 0.1;
      player.y += e.movementY * 0.1;
    }

    // Handle keyboard inputs
    document.addEventListener('keydown', (e) => (keys[e.key] = true));
    document.addEventListener('keyup', (e) => (keys[e.key] = false));

    // Update game state
    function update() {
      if (keys['w']) player.y -= player.speed;
      if (keys['s']) player.y += player.speed;
      if (keys['a']) player.x -= player.speed;
      if (keys['d']) player.x += player.speed;

      monsters.forEach((monster) => {
        if (monster.x < player.x) monster.x += monster.speed;
        if (monster.x > player.x) monster.x -= monster.speed;
        if (monster.y < player.y) monster.y += monster.speed;
        if (monster.y > player.y) monster.y -= monster.speed;
      });
    }

    // Draw the game
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw player
      ctx.fillStyle = 'white';
      ctx.fillRect(player.x, player.y, 20, 20);

      // Draw monsters
      ctx.fillStyle = 'red';
      monsters.forEach((monster) => {
        ctx.fillRect(monster.x, monster.y, 20, 20);
      });
    }

    // Main game loop
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
