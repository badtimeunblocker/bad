<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPS Horror Game - First-Person Perspective</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/PointerLockControls.js"></script>
    <script>
        let scene, camera, renderer, controls;
        const playerVelocity = new THREE.Vector3();
        const gravity = -0.05;
        let isJumping = false;
        const walkSpeed = 0.05;
        const runSpeed = 0.1;
        let moveSpeed = walkSpeed;

        // Setup scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        scene.fog = new THREE.FogExp2(0x000000, 0.08);

        // Setup camera
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

        // Setup renderer
        renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // PointerLockControls for first-person view
        controls = new THREE.PointerLockControls(camera, document.body);
        document.body.addEventListener('click', () => controls.lock());

        // Ground
        const floorGeometry = new THREE.PlaneGeometry(200, 200);
        const floorMaterial = new THREE.MeshBasicMaterial({ color: 0x444444 });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Walls (maze structure)
        for (let i = 0; i < 15; i++) {
            const wallGeometry = new THREE.BoxGeometry(5, 5, 5);
            const wallMaterial = new THREE.MeshBasicMaterial({ color: 0x222222 });
            const wall = new THREE.Mesh(wallGeometry, wallMaterial);
            wall.position.set(
                Math.random() * 100 - 50,
                2.5,
                Math.random() * 100 - 50
            );
            scene.add(wall);
        }

        // Add a light source
        const light = new THREE.PointLight(0xffffff, 1, 100);
        light.position.set(0, 20, 0);
        scene.add(light);

        // Input tracking for movement
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;

            // Enable running when Shift is pressed
            if (e.code === 'ShiftLeft') {
                moveSpeed = runSpeed;
            }
        });
        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;

            // Revert to walking speed when Shift is released
            if (e.code === 'ShiftLeft') {
                moveSpeed = walkSpeed;
            }
        });

        function movePlayer() {
            playerVelocity.set(0, playerVelocity.y, 0);

            // Forward and backward movement
            const forward = new THREE.Vector3();
            camera.getWorldDirection(forward);
            if (keys['KeyW']) playerVelocity.addScaledVector(forward, moveSpeed);
            if (keys['KeyS']) playerVelocity.addScaledVector(forward, -moveSpeed);

            // Left and right strafing
            const right = new THREE.Vector3();
            right.crossVectors(forward, camera.up).normalize();
            if (keys['KeyA']) playerVelocity.addScaledVector(right, -moveSpeed);
            if (keys['KeyD']) playerVelocity.addScaledVector(right, moveSpeed);

            // Jumping
            if (keys['Space'] && !isJumping) {
                playerVelocity.y = 0.2;
                isJumping = true;
            }

            // Apply gravity
            playerVelocity.y += gravity;

            // Prevent falling below ground level
            if (camera.position.y <= 1.5) {
                playerVelocity.y = 0;
                isJumping = false;
                camera.position.y = 1.5;
            }

            camera.position.add(playerVelocity);
        }

        function animate() {
            requestAnimationFrame(animate);
            movePlayer();
            renderer.render(scene, camera);
        }

        animate();

        // Handle window resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
